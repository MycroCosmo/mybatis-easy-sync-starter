plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.34.0'
}

// group/version은 루트 build.gradle의 allprojects 설정을 따른다 (core와 항상 동일 버전)

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    compileOnly project(':mybatis-easy-core')

    // APT 등
    compileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'
    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'

    // XML 파싱(원하는 걸로)
    implementation 'org.jsoup:jsoup:1.17.2'

    testImplementation project(':mybatis-easy-core')
    testImplementation 'com.google.testing.compile:compile-testing:0.21.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

mavenPublishing {
    coordinates(project.group.toString(), 'mybatis-easy-processor', project.version.toString())
    pom {
        name = 'MyBatis Easy Processor'
        description = 'Annotation processor that compares MyBatis Mapper methods with XML statement IDs at compile time.'
    }
}
