plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.34.0'
    id 'io.spring.dependency-management'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.1"
    }
}

dependencies {
    api 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    api 'org.springframework.boot:spring-boot-starter-jdbc'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') { useJUnitPlatform() }

mavenPublishing {
    coordinates(project.group.toString(), 'mybatis-easy-core', project.version.toString())
    pom {
        name = 'MyBatis Easy Core'
        description = 'Runtime CRUD SQL merging, field/column mapping and a development-time entity generator for MyBatis on Spring Boot.'
    }
}
